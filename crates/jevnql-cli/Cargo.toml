[package]
name = "jevnql-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "JevNQL command-line interface"

[[bin]]
name = "jevnql"
path = "src/main.rs"

[dependencies]
jevnql-core = { path = "../jevnql-core" }
jevir = { path = "../jevir" }
jev-nql = { path = "../jev-nql" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
serde.workspace = true
datafusion = "55.1"
