[package]
name = "jev-executor"
version = "0.1.0"
edition.workspace = true
description = "JevNQL executor: runs JevIR plans on DataFusion (relational) and semantic backends"

[dependencies]
jevir = { path = "../jevir" }
datafusion = "55.1"
thiserror.workspace = true
jev-provider = { path = "../jev-provider" }
futures = "0.3"
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
jev-optimizer = { path = "../jev-optimizer" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
serde_json.workspace = true
